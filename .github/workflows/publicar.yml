name: Publicar o Novelo

# Toda vez que a main muda, o app é construído e publicado no GitHub Pages.
# É o que dá à Camila um endereço comum, sem conta e sem login.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se duas correrem juntas, a mais nova espera.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Os testes de navegador rodam contra o pacote construído, que é o mesmo
  # arquivo que vai para o ar. Se algum passo aqui reprovar, nada é publicado —
  # é uma peça de semanas do outro lado.
  provar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report
          retention-days: 14

  construir:
    needs: provar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
