<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <!--
      Sem maximum-scale: o zoom com dois dedos é do aparelho dela, não meu.
      Travar o zoom num app feito para quem enxerga mal é o contrário do que se
      quer, e reprova a regra 1.4.4 da WCAG.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfaf6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1512" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Novelo" />
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <title>Novelo</title>
  </head>
  <body>
    <!--
    DIREÇÃO — o mundo do Novelo.

    Papel claro, marrom de barro, e o tema que a pessoa já escolheu no aparelho.
    Esta é a paleta original. Houve uma passagem por um mundo de nogueira escura
    com ferragem de latão — "O Armarinho" — que o dono do projeto pediu para
    desfazer; fica registrado aqui para ninguém refazer o caminho por engano.

    O que veio junto do armarinho e não era cor permaneceu: as fontes
    hospedadas, a biblioteca de amostras, o colchete de repetição, a sombra de
    rolagem e as correções de contraste, de transbordo e de movimento reduzido.
  -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
